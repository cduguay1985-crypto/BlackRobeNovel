<!DOCTYPE html>
<html>
    <style>
        .subscribe-button{
            width: 105px;
            height: 36px;
            background-color: rgb(200, 0, 0);
            color: white;
            border: none;
            border-radius: 2px;
            cursor: pointer;
            margin-right: 8px;
        }

        .join-button{
            width: 62px;
            height: 36px;
            color: rgb(114, 164, 252);
            background-color: transparent;
            border-color: rgb(114, 164, 252);
            border-width: 1px;
            border-radius: 2px;
            border-style: solid;
            cursor: pointer;
        }

        .tweet{
            width: 65px;
            height: 36px;
            color: white;
            font-weight: bold;
            border-radius: 50px;
            border-style: none;
            background-color: rgb(114, 164, 252);
            cursor: pointer;
            margin-left: 8px;
        }
    </style>

<button class="subscribe-button">Subscribe</button>
<button class="join-button">Join</button>
<button class="tweet">Tweet</button>

</html>
